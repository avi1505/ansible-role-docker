---
- name: Systeem check
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == "Ubuntu"
      - ansible_facts['distribution_version'] == "24.04"
    fail_msg: Deze role is bedoeld voor Ubuntu 24.04.

- name: Docker Compose installeren
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ docker_apt_cache_valid_time }}"

- name: Docker starten en automatisch laten opstarten
  ansible.builtin.service:
    name: "{{ docker_service_name }}"
    state: started
    enabled: true

- name: Controleren of de Docker daemon bereikbaar is
  ansible.builtin.command: docker info
  changed_when: false

- name: Docker Compose versie check
  ansible.builtin.command: docker compose version
  register: docker_compose_version
  changed_when: false

- name: Print Docker Compose versie
  ansible.builtin.debug:
    msg: "{{ docker_compose_version.stdout }}"
